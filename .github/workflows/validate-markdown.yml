name: Validate Markdown

# ─────────────────────────────────────────────────────────────────────
# このフォークでは自動実行を止めています。
#
# 理由: フォーク元（microsoft/generative-ai-for-beginners）の教材向けの
# チェックで、このリポジトリで追加した business-card-system には当てはまらない
# ためです。具体的には
#   ・教材ノートブックが2023年から参照している画像の欠落を毎回報告する
#   ・Microsoft の流入計測用トラッキングID（wt.mc_id）を社内文書にも要求する
#   ・Azure のデプロイに必要な認証情報がこのフォークに無い
# という内容で、いずれも直すべきものではありません。
#
# ファイルは残してあるので、元に戻すときは下の on: を元の内容へ差し替えます
# （git log でこのコミットを見れば元の指定が分かります）。
# 手動で走らせたい場合は Actions タブから Run workflow で実行できます。
# ─────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-broken-paths:
    name: Check Broken Relative Paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check broken Paths
        id: check-broken-paths
        uses: john0isaac/action-check-markdown@v1.0.6
        with:
          command: check_broken_paths
          directory: ./
          guide-url: 'https://github.com/microsoft/generative-ai-for-beginners/blob/main/CONTRIBUTING.md'
          github-token: ${{ secrets.GITHUB_TOKEN }}
  check-paths-tracking:
    if: ${{ always() }}
    needs: check-broken-paths
    name: Check Paths Have Tracking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run Check paths tracking
        id: check-paths-tracking
        uses: john0isaac/action-check-markdown@v1.0.6
        with:
          command: check_paths_tracking
          directory: ./
          guide-url: 'https://github.com/microsoft/generative-ai-for-beginners/blob/main/CONTRIBUTING.md'
          github-token: ${{ secrets.GITHUB_TOKEN }}
  check-urls-tracking:
    if: ${{ always() }}
    needs: check-paths-tracking
    name: Check URLs Have Tracking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run Check URLs tracking
        id: check-urls-tracking
        uses: john0isaac/action-check-markdown@v1.0.6
        with:
          command: check_urls_tracking
          directory: ./
          guide-url: 'https://github.com/microsoft/generative-ai-for-beginners/blob/main/CONTRIBUTING.md'
          github-token: ${{ secrets.GITHUB_TOKEN }}
  check-urls-locale:
    if: ${{ always() }}
    needs: check-urls-tracking
    name: Check URLs Don't Have Locale
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run Check URLs Country Locale
        id: check-urls-locale
        uses: john0isaac/action-check-markdown@v1.0.6
        with:
          command: check_urls_locale
          directory: ./
          guide-url: 'https://github.com/microsoft/generative-ai-for-beginners/blob/main/CONTRIBUTING.md'
          github-token: ${{ secrets.GITHUB_TOKEN }}
